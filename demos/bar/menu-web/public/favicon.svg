<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <style>
    .favicon-text {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-weight: 700;
      font-size: 20px;
    }
    .fd {
      fill: #111111; /* O blanco si tu fondo es oscuro */
    }
    .num {
      fill: #C99E56; /* Tu dorado de marca */
    }
    .bg {
      fill: transparent; /* Ponle un color si quieres fondo ej: #111111 */
    }
  </style>

  <rect width="100%" height="100%" fill="#ffffff" rx="8"/>
  
  <!-- Fondo opcional (déjalo transparente o ponle color) -->
  <rect width="60" height="60" rx="12" class="bg"/>

  <!-- Monograma centrado: FD19 -->
  <text x="6" y="37" class="favicon-text">
    <tspan class="fd">FD</tspan><tspan class="num">19</tspan>
  </text>
</svg>